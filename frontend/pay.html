<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单支付 - 中渔天下</title>
    <meta name="description" content="选择扫码或余额完成订单付款。">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400..900&family=Noto+Serif+SC:wght@400..900&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400..900&family=Noto+Serif+SC:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/theme.css">
    <link rel="stylesheet" href="assets/tailwind.build.css">
    <script src="auth.js"></script>
</head>
<body class="bg-stone-50 font-sans text-ink-800 antialiased">
    <a class="skip-link" href="#main">跳到主内容</a>

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-stone-100">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-ink-900">
                <span class="text-brand-600" style="display:inline-flex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1.5em;height:1.5em;vertical-align:middle;flex-shrink:0" aria-hidden="true"><path d="M3 12c2.2-3.6 6.6-3.6 9 0 2.4 3.6 6.8 3.6 9 0"/><path d="M21 12l3-2.4v4.8z"/><circle cx="9" cy="10" r=".9"/></svg></span>
                <span>中渔天下</span>
            </a>
            <a href="profile.html" class="text-sm text-ink-600 hover:text-brand-600 transition">我的订单</a>
        </div>
    </nav>

    <main id="main" tabindex="-1" class="container-x py-10">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-2xl font-bold text-ink-900">订单支付</h1>
            <p class="text-sm text-ink-500 mt-1">
                选择<b>扫码支付</b>（手机扫右侧二维码）或<b>余额支付</b>（直接扣账户余额）。
                付款成功后本页会自动更新，无需手动刷新。
            </p>

            <div class="grid md:grid-cols-2 gap-6 mt-6">
                <!-- 左：订单摘要 -->
                <div class="bg-white rounded-2xl border border-brand-100 shadow-xl shadow-brand-500/5 p-6">
                    <h2 class="text-base font-bold text-ink-900 mb-4">订单信息</h2>
                    <div id="orderBox" class="text-sm text-ink-500">加载中…</div>

                    <div class="mt-6 pt-5 border-t border-stone-100">
                        <div class="flex items-baseline justify-between">
                            <span class="text-sm text-ink-500">应付金额</span>
                            <span id="amountText" class="text-2xl font-bold text-brand-700">—</span>
                        </div>
                    </div>

                    <p class="text-xs text-ink-400 mt-4 leading-relaxed">
                        提示：本页是本项目的<b>模拟收银台</b>。扫码付款时手机需要和这台电脑在同一个局域网内
                        （同一 Wi-Fi）—— 二维码里的地址会自动换成电脑的局域网 IP，所以手机才扫得开。
                        余额支付没有这个限制，在本机点一下即可。
                    </p>
                </div>

                <!-- 右：支付方式（切换）→ 二维码 / 余额 / 状态 -->
                <div class="bg-white rounded-2xl border border-brand-100 shadow-xl shadow-brand-500/5 p-6">
                    <div id="methodTabs" class="grid grid-cols-2 gap-2 p-1 bg-stone-100 rounded-xl mb-5"
                         role="tablist" aria-label="支付方式"></div>
                    <div id="payBox" class="text-center text-sm text-ink-500 py-6">正在生成二维码…</div>
                </div>
            </div>

            <p class="text-xs text-ink-400 mt-6">
                付款遇到问题？
                <a href="contact.html" class="text-brand-700 hover:underline">联系客服</a>
                ，或到
                <a href="profile.html" class="text-brand-700 hover:underline">我的订单</a>
                里查看这笔订单。
            </p>
        </div>
    </main>

<script>
/* ════════════════════════════════════════════════════════════
   收银台（PC 端）—— /pay/<order_no>/

   两种支付方式，同一个终点（订单落「已支付」）：
     · 扫码支付：要一张一次性凭据 → 渲染二维码 → 每 3 秒问一次付了没
     · 余额支付：本会话已登录，直接扣账户余额，点一下就到账
   切换方式不会作废已开的二维码（切回去还能扫），但任一条路付成功后，
   屏上那张码会被后端一并作废 —— 已经付清了，不该还能再扫。

   五个刻意的取舍：
   1. **订单号从路径里解析**，不读查询串 —— 收银台是要刷新、要回退、
      要贴给别人看的页面，路径更稳。
   2. **轮询而不是 WebSocket**：本项目已有 SSE 流式输出的经验，但收银台
      只关心一个布尔值，3 秒一问的实现与调试成本都低得多，也不占用长连接。
      页面切到后台时暂停轮询（visibilitychange），别让没人看的页面一直打接口。
   3. **不做乐观更新**：只有后端明确说「已支付」才切成功态 ——
      支付这种事的容错方向必须是"慢一点"，而不是"看起来成功了"。
   4. **余额不足在点击前就告诉用户**：进页面就拉一次余额，不够时按钮直接禁用
      并写明"还差多少 + 去哪充"。让用户点了才报错，是把可避免的失败当成常态。
      服务端仍然会拦（另一标签页刚花掉钱这类竞态），但那属于兜底，
      不是主要交互路径。
   5. **余额与金额都用字符串搬运**：金额是 Decimal，JS 的 Number 在
      0.1+0.2 上就出偏差，收银台上一个浮点误差就是账实不符。展示用
      parseFloat 只为排版，"够不够付"的比较一律在后端做。
   ════════════════════════════════════════════════════════════ */
(function () {
    'use strict';

    var POLL_MS = 3000;

    // 支付方式的展示文案集中一处 —— 与后端 PayChannel 的取值同名，方便对照
    var METHODS = [
        { key: '扫码支付', label: '扫码支付', hint: '手机扫一扫' },
        { key: '余额支付', label: '余额支付', hint: '账户余额' }
    ];

    var state = {
        orderNo: '',
        method: '扫码支付',
        ticket: null,
        qrSvg: '',
        payUrl: '',
        balance: null,      // null = 还没拿到；拿到后是字符串（如 "312.50"）
        order: null,
        timer: null,      // 倒计时
        poll: null,       // 轮询
        busy: false,      // 余额支付提交中
        paid: false,
        alive: true
    };

    var els = {};

    function $(id) { return document.getElementById(id); }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    // 路径形如 /pay/ZT-20260101-0001/ → 取中间那段
    function orderNoFromPath() {
        var m = /^\/pay\/([^\/]+)\/?$/.exec(location.pathname);
        if (m) return decodeURIComponent(m[1]);
        // 兜底：?order=xxx（方便本地直接开文件调试）
        return new URLSearchParams(location.search).get('order') || '';
    }

    function mmss(sec) {
        sec = Math.max(0, sec | 0);
        var m = Math.floor(sec / 60), s = sec % 60;
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function stopTimers() {
        stopCountdown();
        if (state.poll) { clearInterval(state.poll); state.poll = null; }
    }

    function stopCountdown() {
        if (state.timer) { clearInterval(state.timer); state.timer = null; }
    }

    // 金额一律走字符串 → 显示时才 parseFloat。JS 的 Number 连 0.1+0.2 都不准，
    // 收银台上一个浮点误差就是账实不符；"够不够付"的比较完全交给后端。
    function money(v) {
        var n = parseFloat(v);
        if (isNaN(n)) return v == null ? '0.00' : String(v);
        return n.toFixed(2);
    }

    // ── 支付方式切换 ─────────────────────────────────────────
    function renderMethodTabs() {
        els.methodTabs.innerHTML = METHODS.map(function (m) {
            var on = (state.method === m.key);
            return '<button type="button" role="tab" data-method="' + esc(m.key) + '"'
                + ' aria-selected="' + (on ? 'true' : 'false') + '"'
                + ' class="rounded-lg px-3 py-2 transition '
                + (on ? 'bg-white shadow-sm text-brand-700 font-semibold'
                      : 'text-ink-500 hover:text-ink-700') + '">'
                + '<span class="block text-sm">' + esc(m.label) + '</span>'
                + '<span class="block text-xs ' + (on ? 'text-brand-600' : 'text-ink-400') + '">'
                + esc(m.hint) + '</span>'
                + '</button>';
        }).join('');
        Array.prototype.forEach.call(els.methodTabs.querySelectorAll('[data-method]'), function (b) {
            b.onclick = function () { switchMethod(b.getAttribute('data-method')); };
        });
    }

    function switchMethod(key) {
        if (state.paid || state.method === key) return;
        state.method = key;
        renderMethodTabs();
        renderPayArea();
    }

    function renderPayArea() {
        if (state.paid) { renderPaid(); return; }
        if (state.method === '余额支付') { renderBalance(''); return; }
        renderReady();
    }

    // ── 订单摘要 ─────────────────────────────────────────────
    function renderOrder(o) {
        if (!o || !o.order_no) { els.orderBox.innerHTML = '<span class="text-ink-400">订单信息不可用</span>'; return; }
        state.order = o;
        var rows = [
            ['订单号', o.order_no],
            ['产品', (o.product_name || '—') + (o.quantity ? (' × ' + o.quantity) : '')],
            ['收货人', (o.customer_name || '—') + (o.phone ? ('　' + o.phone) : '')],
            ['收货地址', o.address || '—'],
            ['下单时间', o.created_at || '—']
        ];
        els.orderBox.innerHTML = rows.map(function (r) {
            return '<div class="flex gap-3 py-2 border-b border-stone-100 last:border-0">'
                + '<span class="w-16 flex-shrink-0 text-ink-400">' + esc(r[0]) + '</span>'
                + '<span class="flex-1 text-ink-800 break-words">' + esc(r[1]) + '</span>'
                + '</div>';
        }).join('');
        els.amountText.textContent = '¥' + money(o.total_price);
    }

    // ── 余额支付面板 ─────────────────────────────────────────
    async function loadBalance() {
        try {
            var r = await callApi('/api/me/wallet/?limit=1');
            if (r.ok && r.data && r.data.balance != null) {
                state.balance = String(r.data.balance);
            }
        } catch (e) { /* 拿不到余额就按"未知"处理：扫码支付仍可正常用 */ }
        return state.balance;
    }

    function renderBalance(hint) {
        stopCountdown();                        // 没有二维码要倒计时
        var need = parseFloat((state.order && state.order.total_price) || 0) || 0;
        var bal = (state.balance == null) ? null : parseFloat(state.balance);
        var known = (bal !== null && !isNaN(bal));
        var enough = known && (bal + 1e-9 >= need);

        var rows = ''
            + '<div class="flex items-baseline justify-between py-2 border-b border-stone-100">'
            +   '<span class="text-ink-400">账户余额</span>'
            +   '<span class="text-ink-800 font-semibold">' + (known ? '¥' + money(bal) : '读取中…') + '</span>'
            + '</div>'
            + '<div class="flex items-baseline justify-between py-2 border-b border-stone-100">'
            +   '<span class="text-ink-400">本单应付</span>'
            +   '<span class="text-ink-800">¥' + money(need) + '</span>'
            + '</div>'
            + '<div class="flex items-baseline justify-between py-2">'
            +   '<span class="text-ink-400">支付后余额</span>'
            +   '<span class="text-ink-800">' + (known ? '¥' + money(Math.max(0, bal - need)) : '—') + '</span>'
            + '</div>';

        var foot;
        if (!known) {
            foot = '<button type="button" id="balBtn" disabled '
                + 'class="w-full mt-4 px-5 py-2.5 bg-stone-200 text-ink-400 text-sm font-semibold rounded-full">余额读取中…</button>';
        } else if (enough) {
            foot = '<button type="button" id="balBtn" '
                + 'class="w-full mt-4 px-5 py-2.5 bg-brand-600 text-white text-sm font-semibold rounded-full hover:bg-brand-700 transition">'
                + '用余额支付 ¥' + money(need) + '</button>';
        } else {
            foot = '<button type="button" id="balBtn" disabled '
                + 'class="w-full mt-4 px-5 py-2.5 bg-stone-200 text-ink-400 text-sm font-semibold rounded-full">'
                + '余额不足，还差 ¥' + money(need - bal) + '</button>'
                + '<a href="profile.html#wallet" class="block mt-2 text-center text-sm text-brand-700 hover:underline">去充值 →</a>';
        }

        els.payBox.innerHTML = ''
            + (hint ? '<div class="mb-4 px-3 py-2 rounded-lg border border-amber-200 bg-amber-50 text-xs text-left text-amber-700">' + esc(hint) + '</div>' : '')
            + '<div class="text-sm text-left">' + rows + '</div>'
            + foot
            + '<p class="text-xs text-ink-400 mt-4 leading-relaxed">'
            + '余额支付直接扣本账户的预存余额，不经过第三方渠道，确认后立即到账。'
            + '</p>';

        if (enough) $('balBtn').onclick = function () { payByBalance(); };
    }

    async function payByBalance() {
        if (state.busy || state.paid) return;
        state.busy = true;
        var btn = $('balBtn');
        if (btn) { btn.disabled = true; btn.textContent = '支付中…'; }
        try {
            var r = await callApi('/api/pay/' + encodeURIComponent(state.orderNo) + '/balance/', { method: 'POST' });
            if (r.data && r.data.balance != null) state.balance = String(r.data.balance);
            if (r.ok) {
                state.paid = true;
                if (r.data.order) renderOrder(r.data.order);
                renderPaid();
                return;
            }
            if (r.data && r.data.code === 'insufficient') {
                // 竞态兜底：别的地方刚花掉了钱。刷新余额并给充值引导，不是"重试"。
                renderBalance('余额不足，还差 ¥' + money(r.data.shortage || 0) + '。请先充值后重试。');
                return;
            }
            renderBalance((r.data && r.data.message) || ('支付失败（' + r.status + '）'));
        } catch (e) {
            renderBalance('网络异常：' + (e.message || '请稍后重试'));
        } finally {
            state.busy = false;
        }
    }

    // ── 二维码与状态 ─────────────────────────────────────────
    function renderReady() {
        var t = state.ticket || {};
        var qr = state.qrSvg
            ? '<div class="mx-auto bg-white p-2 rounded-xl border border-stone-200" style="width:240px;height:240px">'
              + state.qrSvg.replace('<svg ', '<svg style="width:100%;height:100%;display:block" ')
              + '</div>'
            : '<div class="mx-auto rounded-xl border border-dashed border-stone-300 text-xs text-ink-400 flex items-center justify-center" style="width:240px;height:240px">'
              + '二维码组件不可用，请用下面的链接付款</div>';

        els.payBox.innerHTML = ''
            + qr
            + '<p class="text-sm text-ink-600 mt-4">用手机相机 / 微信扫一扫，打开后点「确认付款」</p>'
            + '<p id="cd" class="text-sm font-semibold text-brand-700 mt-2">二维码剩余有效期 ' + mmss(t.remain_seconds) + '</p>'
            + '<div class="mt-3 flex items-center justify-center gap-2">'
            +   '<button type="button" id="copyBtn" class="px-3 py-1.5 text-xs border border-stone-200 text-ink-600 rounded-full hover:bg-stone-50 transition">复制支付链接</button>'
            +   '<button type="button" id="regenBtn" class="px-3 py-1.5 text-xs border border-stone-200 text-ink-600 rounded-full hover:bg-stone-50 transition">重新生成</button>'
            + '</div>'
            + '<p class="text-xs text-ink-400 mt-3 break-all" id="urlText">' + esc(state.payUrl) + '</p>';

        $('regenBtn').onclick = function () { loadTicket(true); };
        $('copyBtn').onclick = function () { copyUrl(); };

        startCountdown();
    }

    function renderPaid() {
        stopTimers();
        els.payBox.innerHTML = ''
            + '<div class="mx-auto w-14 h-14 bg-gradient-to-br from-brand-500 to-lake-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-brand-500/30">'
            +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:1.8em;height:1.8em" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>'
            + '</div>'
            + '<p class="text-lg font-bold text-ink-900 mt-4">支付成功</p>'
            + '<p class="text-sm text-ink-500 mt-1">商家将尽快为您安排发货。</p>'
            + '<a href="profile.html" class="inline-block mt-5 px-5 py-2.5 bg-brand-600 text-white text-sm font-semibold rounded-full hover:bg-brand-700 transition">查看我的订单</a>';
    }

    function renderNotice(title, desc, actionLabel) {
        stopTimers();
        els.payBox.innerHTML = ''
            + '<div class="py-6">'
            +   '<p class="text-base font-bold text-ink-900">' + esc(title) + '</p>'
            +   '<p class="text-sm text-ink-500 mt-2">' + esc(desc) + '</p>'
            + '</div>'
            + (actionLabel
                ? '<button type="button" id="retryBtn" class="px-5 py-2.5 bg-brand-600 text-white text-sm font-semibold rounded-full hover:bg-brand-700 transition">' + esc(actionLabel) + '</button>'
                : '<a href="profile.html" class="inline-block px-5 py-2.5 border border-stone-200 text-ink-600 text-sm rounded-full hover:bg-stone-50 transition">返回我的订单</a>');
        if (actionLabel) $('retryBtn').onclick = function () { loadTicket(true); };
    }

    function startCountdown() {
        stopCountdown();
        // 用「截止时刻」而不是「剩余秒数递减」：后台标签页里 setInterval 会被浏览器
        // 节流甚至冻结，累减出来的倒计时会越走越偏 —— 而收银台上的倒计时
        // 一旦说谎（显示还有 3 分钟、其实早过期了），用户会一直等着扫一张废码。
        var left = (state.ticket && state.ticket.remain_seconds) || 0;
        var deadline = Date.now() + left * 1000;
        var tick = function () {
            var sec = Math.max(0, Math.round((deadline - Date.now()) / 1000));
            var node = $('cd');
            if (sec > 0) {
                if (node) node.textContent = '二维码剩余有效期 ' + mmss(sec);
                return;
            }
            stopCountdown();
            renderNotice('二维码已过期', '为安全起见，二维码有效期只有几分钟。点下面重新生成一张即可。', '重新生成二维码');
        };
        state.timer = setInterval(tick, 1000);
        tick();
    }

    function copyUrl() {
        var text = state.payUrl;
        if (!text) return;
        var done = function () {
            var b = $('copyBtn');
            if (b) { b.textContent = '已复制'; setTimeout(function () { b.textContent = '复制支付链接'; }, 1600); }
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
        } else {
            fallbackCopy(text, done);
        }
    }

    function fallbackCopy(text, done) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', 'readonly');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { /* 复制失败就手动选 */ }
        document.body.removeChild(ta);
    }

    // ── 请求 ────────────────────────────────────────────────
    async function callApi(url, options) {
        var resp = await AUTH.authFetch(url, options || {}, { silentAuthFail: false });
        var data = {};
        try { data = await resp.json(); } catch (e) { data = {}; }
        return { ok: resp.ok, status: resp.status, data: data };
    }

    async function loadTicket(force) {
        stopTimers();
        els.payBox.innerHTML = '<div class="py-6 text-sm text-ink-500">正在生成二维码…</div>';
        try {
            var r = await callApi('/api/pay/' + encodeURIComponent(state.orderNo) + '/ticket/', { method: 'POST' });
            if (!r.ok) {
                renderNotice('无法发起付款', r.data.message || ('请求失败（' + r.status + '）'), '重新试一次');
                return;
            }
            state.ticket = r.data.ticket || {};
            state.qrSvg = r.data.qr_svg || '';
            state.payUrl = r.data.pay_url || '';
            renderOrder(r.data.order);
            if (state.ticket.status === '已支付') { state.paid = true; renderPaid(); return; }
            renderMethodTabs();
            renderPayArea();
            startPolling();
        } catch (e) {
            renderNotice('网络异常', e.message || '请检查网络后重试', '重新试一次');
        }
    }

    function startPolling() {
        if (state.poll) clearInterval(state.poll);
        state.poll = setInterval(checkStatus, POLL_MS);
    }

    async function checkStatus() {
        if (!state.alive || state.paid) return;
        try {
            var r = await callApi('/api/pay/' + encodeURIComponent(state.orderNo) + '/status/');
            if (!r.ok) return;                      // 轮询失败静默重试，不打断用户
            if (r.data.order) renderOrder(r.data.order);
            if (r.data.paid) { state.paid = true; renderPaid(); return; }
            // 凭据被别处作废（同一订单在别处付掉了）/ 过期 → 停止倒计时并提示
            var tk = r.data.ticket;
            if (tk && tk.status === '已取消') {
                renderNotice('这笔订单已在别处完成支付', '请到「我的订单」确认订单状态。', '');
            }
        } catch (e) { /* 静默 */ }
    }

    // ── 初始化 ──────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async function () {
        els.orderBox = $('orderBox');
        els.payBox = $('payBox');
        els.amountText = $('amountText');
        els.methodTabs = $('methodTabs');

        var ok = await AUTH.init({ requireAuth: true, reason: '登录后即可查看并支付这笔订单' });
        if (!ok) return;

        state.orderNo = orderNoFromPath();
        if (!state.orderNo) {
            renderNotice('订单号缺失', '这个支付链接不完整，请从「我的订单」里重新进入。', '');
            return;
        }

        // 页面切到后台就停轮询，回来再继续 —— 没人看的页面不该一直打接口
        document.addEventListener('visibilitychange', function () {
            state.alive = (document.visibilityState === 'visible');
            if (!state.alive) return;
            if (!state.paid && !state.poll) startPolling();
            checkStatus();
        });

        renderMethodTabs();
        await loadBalance();     // 先拿余额：够不够付要在用户点击**之前**说清楚
        await loadTicket();
    });
})();
</script>
</body>
</html>
